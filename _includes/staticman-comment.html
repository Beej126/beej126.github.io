<article id="comment{{ include.index }}" class="js-comment comment">
  <div class="comment__avatar-wrapper">
    <img class="comment__avatar" src="https://www.gravatar.com/avatar/{{ include.email }}?d=mm&s=80" alt="{{ include.name }}">
  </div>
  <div class="comment__content-wrapper">
    <h4 class="comment__author">
      {% unless include.url == blank %}
        <span><a rel="external nofollow" href="{{ include.url }}">{{ include.name }}</a></span>
      {% else %}
        <span>{{ include.name }}</span>
      {% endunless %}
    </h4>
    <p class="comment__date">
      {% if include.date %}
        {% if include.index %}<a href="#comment{{ include.index }}">{% endif %}
        <time datetime="{{ include.date | date_to_xmlschema }}">{{ include.date | date: "%B %d, %Y at %I:%M %p" }}</time>
        {% if include.index %}</a>{% endif %}
      {% endif %}
    </p>
    <div>{{ include.message | markdownify }}</div>
  </div>
</article>
